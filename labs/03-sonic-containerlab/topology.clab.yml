name: sonic-basic

topology:
  kinds:
    sonic-vs:
      image: docker-sonic-vs:202511

  nodes:
    sonic1:
      kind: sonic-vs

    host1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.0.2.11/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["sonic1:eth1", "host1:eth1"]
