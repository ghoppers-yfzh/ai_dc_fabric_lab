name: frr-leaf-spine

topology:
  nodes:
    spine1:
      kind: linux
      image: frrouting/frr:latest
    spine2:
      kind: linux
      image: frrouting/frr:latest

    leaf1:
      kind: linux
      image: frrouting/frr:latest
    leaf2:
      kind: linux
      image: frrouting/frr:latest
    leaf3:
      kind: linux
      image: frrouting/frr:latest
    leaf4:
      kind: linux
      image: frrouting/frr:latest

    host1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
    host2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
    host3:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
    host4:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity

  links:
    # spine1 to leaves
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]

    # spine2 to leaves
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]

    # leaf to hosts
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "host2:eth1"]
    - endpoints: ["leaf3:eth3", "host3:eth1"]
    - endpoints: ["leaf4:eth3", "host4:eth1"]
