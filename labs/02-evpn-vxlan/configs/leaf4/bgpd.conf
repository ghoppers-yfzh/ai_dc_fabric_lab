hostname leaf4
log stdout

router bgp 65104
 bgp router-id 10.255.1.4
 no bgp ebgp-requires-policy

 neighbor 10.0.0.10 remote-as 65000
 neighbor 10.0.0.10 description spine1 eth4

 neighbor 10.0.0.14 remote-as 65000
 neighbor 10.0.0.14 description spine2 eth4

 address-family ipv4 unicast
  network 10.255.1.4/32
  maximum-paths 2
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.0.0.10 activate
  neighbor 10.0.0.14 activate
  advertise-all-vni
  vni 10020
   route-target import 65000:10020
   route-target export 65000:10020
  exit-vni
 exit-address-family