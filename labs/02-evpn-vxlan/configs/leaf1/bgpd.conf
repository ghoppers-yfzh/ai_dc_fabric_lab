hostname leaf1
log stdout

router bgp 65101
 bgp router-id 10.255.1.1
 no bgp ebgp-requires-policy

 neighbor 10.0.0.0 remote-as 65000
 neighbor 10.0.0.0 description spine1 eth1

 neighbor 10.0.0.4 remote-as 65000
 neighbor 10.0.0.4 description spine2 eth1

 address-family ipv4 unicast
  network 10.255.1.1/32
  maximum-paths 2
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.0.0.0 activate
  neighbor 10.0.0.4 activate
  advertise-all-vni
  vni 10010
   route-target import 65000:10010
   route-target export 65000:10010
  exit-vni
 exit-address-family
