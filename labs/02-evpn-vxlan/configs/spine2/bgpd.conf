hostname spine2
log stdout

router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy

 neighbor 10.0.0.5 remote-as 65101
 neighbor 10.0.0.5 description leaf1 eth2

 neighbor 10.0.0.7 remote-as 65102
 neighbor 10.0.0.7 description leaf2 eth2

 neighbor 10.0.0.13 remote-as 65103
 neighbor 10.0.0.13 description leaf3 eth2

 neighbor 10.0.0.15 remote-as 65104
 neighbor 10.0.0.15 description leaf4 eth2

 address-family ipv4 unicast
  network 10.255.0.2/32
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.0.0.5 activate
  neighbor 10.0.0.7 activate
  neighbor 10.0.0.13 activate
  neighbor 10.0.0.15 activate
 exit-address-family