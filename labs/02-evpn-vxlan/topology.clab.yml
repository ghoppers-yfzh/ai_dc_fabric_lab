name: evpn-vxlan

topology:
  nodes:
    spine1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/spine1/zebra.conf:/etc/frr/zebra.conf
        - configs/spine1/bgpd.conf:/etc/frr/bgpd.conf
    
    spine2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/spine2/zebra.conf:/etc/frr/zebra.conf
        - configs/spine2/bgpd.conf:/etc/frr/bgpd.conf
    
    leaf1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/leaf1/zebra.conf:/etc/frr/zebra.conf
        - configs/leaf1/bgpd.conf:/etc/frr/bgpd.conf
      exec:
        - ip link add br10 type bridge
        - ip link set br10 up
        - ip link set eth3 master br10
        - ip link set eth3 up
        - ip link add vxlan10010 type vxlan id 10010 dev eth3 local 10.255.1.1 dstport 4789 nolearning
        - ip link set vxlan10010 master br10
        - ip link set vxlan10010 up
        - ip link set dev br10 address 00:00:00:00:10:01
        - ip addr add 192.168.10.1/24 dev br10
        - ip link add tenant-a type vrf table 10099
        - ip link set tenant-a up
        - ip link set br10 master tenant-a
        - ip link add br10099 type bridge
        - ip link set br10099 master tenant-a addrgenmode none
        - ip link set br10099 address 00:00:00:99:00:01
        - ip link add vxlan10099 type vxlan id 10099 local 10.255.1.1 dstport 4789 nolearning
        - ip link set vxlan10099 address 00:00:00:99:00:01
        - ip link set vxlan10099 master br10099 addrgenmode none
        - ip link set vxlan10099 type bridge_slave neigh_suppress on learning off
        - ip link set vxlan10099 up
        - ip link set br10099 up

    leaf2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/leaf2/zebra.conf:/etc/frr/zebra.conf
        - configs/leaf2/bgpd.conf:/etc/frr/bgpd.conf
      exec:
        - ip link add br10 type bridge
        - ip link set br10 up
        - ip link set eth3 master br10
        - ip link set eth3 up
        - ip link add vxlan10010 type vxlan id 10010 dev eth3 local 10.255.1.2 dstport 4789 nolearning
        - ip link set vxlan10010 master br10
        - ip link set vxlan10010 up
        - ip link set dev br10 address 00:00:00:00:10:01
        - ip addr add 192.168.10.1/24 dev br10
    
    leaf3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/leaf3/zebra.conf:/etc/frr/zebra.conf
        - configs/leaf3/bgpd.conf:/etc/frr/bgpd.conf
      exec:
        - ip link add br20 type bridge
        - ip link set br20 up
        - ip link set eth3 master br20
        - ip link set eth3 up
        - ip link add vxlan10020 type vxlan id 10020 dev eth3 local 10.255.1.3 dstport 4789 nolearning
        - ip link set vxlan10020 master br20
        - ip link set vxlan10020 up
        - ip link set dev br20 address 00:00:00:00:20:01
        - ip addr add 192.168.20.1/24 dev br20
        - ip link add tenant-a type vrf table 10099
        - ip link set tenant-a up
        - ip link set br20 master tenant-a
        - ip link add br10099 type bridge
        - ip link set br10099 master tenant-a addrgenmode none
        - ip link set br10099 address 00:00:00:99:00:03
        - ip link add vxlan10099 type vxlan id 10099 local 10.255.1.3 dstport 4789 nolearning
        - ip link set vxlan10099 address 00:00:00:99:00:03
        - ip link set vxlan10099 master br10099 addrgenmode none
        - ip link set vxlan10099 type bridge_slave neigh_suppress on learning off
        - ip link set vxlan10099 up
        - ip link set br10099 up

    leaf4:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/leaf4/zebra.conf:/etc/frr/zebra.conf
        - configs/leaf4/bgpd.conf:/etc/frr/bgpd.conf
      exec:
        - ip link add br20 type bridge
        - ip link set br20 up
        - ip link set eth3 master br20
        - ip link set eth3 up
        - ip link add vxlan10020 type vxlan id 10020 dev eth3 local 10.255.1.4 dstport 4789 nolearning
        - ip link set vxlan10020 master br20
        - ip link set vxlan10020 up
        - ip link set dev br20 address 00:00:00:00:20:01
        - ip addr add 192.168.20.1/24 dev br20
    
    host1:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.10.11/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.10.1
    
    host2:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.10.12/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.10.1
    host3:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.20.13/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.20.1
    
    host4:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.20.14/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.20.1
    
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]

    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]

    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "host2:eth1"]
    - endpoints: ["leaf3:eth3", "host3:eth1"]
    - endpoints: ["leaf4:eth3", "host4:eth1"]
  