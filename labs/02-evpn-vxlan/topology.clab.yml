name: evpn-vxlan

topology:
  nodes:
    spine1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/spine1/zebra.conf:/etc/frr/zebra.conf
        - configs/spine1/bgpd.conf:/etc/frr/bgpd.conf
    
    spine2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/spine2/zebra.conf:/etc/frr/zebra.conf
        - configs/spine2/bgpd.conf:/etc/frr/bgpd.conf
    
    leaf1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/leaf1/zebra.conf:/etc/frr/zebra.conf
        - configs/leaf1/bgpd.conf:/etc/frr/bgpd.conf
    
    leaf2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/common/daemons:/etc/frr/daemons
        - configs/leaf2/zebra.conf:/etc/frr/zebra.conf
        - configs/leaf2/bgpd.conf:/etc/frr/bgpd.conf
    
    host1:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.10.11/24 dev eth1
        - ip link set eth1 up
    
    host2:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.10.12/24 dev eth1
        - ip link set eth1 up
    
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "host2:eth1"]
  
  